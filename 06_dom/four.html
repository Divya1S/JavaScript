<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey there this is the part four of DOM</title>
</head>
<body style="background-color: black; color: aliceblue;">
    <ul class="language">
        <li>JavaScript</li> 
    </ul>
    
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li'); //create Element
        li.innerHTML = `${langName}` //when we use innerHTML we have to traverse the entire tree and the entire operation is very costly
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("Python")
    addLanguage("Typescript")

    //Using and optimized approach to do the same using DSA for large scale company based applications. By avoiding the innerHTML and taking the appendChild and inserting a createTextNode is a good practice
    function addOptiLanguage(langName){
        const li = document.createElement('li');   
        li.appendChild(document.createTextNode(langName)) //created a new textnode and appended the child to li
        document.querySelector('.language').appendChild(li) 
    }
    addOptiLanguage("Golang")

    //Editing the value 
    const secondLang = document.querySelector("li:nth-child(2)") //select the li value
    console.log(secondLang)
    // secondLang.innerHTML = "Mojo" //This approach works but is not optimal (changing the secondLang)
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)
    
    //Another way to Edit 
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>Ruby</li>'

    //Remove 
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

</script>
</html>
