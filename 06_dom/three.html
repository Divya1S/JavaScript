<!-- Programmatically Creating a Styled Div and Appending It to the DOM -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is the title</title>
</head>
<body style="background-color: black; color: aliceblue;">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("tile", "generated title")
    div.style.backgroundColor = "blue"
    div.style.padding = "12px"
    //div.innerText = "hey there how are you"
    const addText = document.createTextNode("Hey there how are you doing")
    div.appendChild(addText)

    //Now attaching all this with a Document 
    document.body.appendChild(div)
</script>
</html>
