<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
<div class="app">
    <div class="topbar">
        <h1>Simple Quiz</h1>
        <span id="high-score" class="high-score"></span>
    </div>
    <div id="start-screen" class="start-screen">
        <label class="field" for="category-select">
            <span class="field-label">Category</span>
            <select id="category-select"></select>
        </label>
        <div class="field">
            <span class="field-label">Difficulty</span>
            <div id="difficulty-options" class="difficulty-options">
                <button type="button" class="diff-btn" data-difficulty="All">All</button>
                <button type="button" class="diff-btn" data-difficulty="Easy">Easy</button>
                <button type="button" class="diff-btn" data-difficulty="Medium">Medium</button>
                <button type="button" class="diff-btn" data-difficulty="Hard">Hard</button>
            </div>
        </div>
        <p id="start-count" class="start-count"></p>
        <button id="start-btn" class="primary-btn">Start Quiz</button>
    </div>

    <div id="quiz-screen" class="quiz" hidden>
        <div class="quiz-head">
            <div id="progress" class="progress"></div>
            <div id="timer" class="timer"></div>
        </div>
        <h2 id="question">Question goes here</h2>
        <div id="answer-buttons"></div>
        <button id="next-btn">Next</button>
        <button id="change-btn" class="ghost-btn">Change category</button>
        <div id="review" class="review"></div>
        <p class="hint">Tip: press <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>Enter</kbd> for next.</p>
    </div>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
